[project]
name = "unflattening"
version = "0.1.0"
description = "Numerical experiments for the `Unflattening by flattening` paper"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "matplotlib>=3.11.0",
    "numpy",
    "jax",
    "optax",
    "scipy",
    "qml-essentials>=0.3.1",
    "jaqsi>=0.1.1",
    "fluksio>=0.1.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["F"]
